name: Manual bounded SSTP test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gate-test-manual
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Verify independent services and test ADMIN
        run: python verify_services.py
        env:
          CHECK_WORKER: ${{ vars.CHECK_WORKER }}
          TEST_EDGE_URL: ${{ vars.TEST_EDGE_URL }}
          TEST_ADMIN: ${{ secrets.TEST_ADMIN }}
      - name: Check at most ten candidates
        run: python vpngate.py
        env:
          CHECK_WORKER: ${{ vars.CHECK_WORKER }}
          CHECK_TOKEN: ${{ secrets.CHECK_TOKEN }}
          MAX_CHECK_NODES: '10'
          CHECK_CONCURRENCY: '2'
          TARGET_COUNTRIES: ${{ vars.TARGET_COUNTRIES || 'US,JP,KR,SG' }}
          EDGE_HOSTS: ${{ vars.EDGE_HOSTS }}
          NODES_URL: https://renatirudy246-maker.github.io/gate-test/nodes.txt
      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-test-diagnostics
          path: diagnostics/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: public
          retention-days: 1
  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish only a successful verified result
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
