name: Manual isolated Node SSTP scan
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gate-test-manual
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: pip install -r requirements.txt
      - name: Verify fail-closed classification and bounded detector
        run: |
          python -m unittest discover -s tests
          node --test tests/node-checker.test.mjs tests/workers.test.mjs
      - name: Run one isolated ten-candidate batch after actual detector health
        run: node node-checker/run.mjs
        env:
          CHECK_TOKEN: ${{ secrets.CHECK_TOKEN }}
          TARGET_COUNTRIES: US,JP,KR,SG
          EDGE_HOSTS: ${{ vars.EDGE_HOSTS }}
          SCAN_BATCH: second
          EXCLUDE_REPORTS: reports/node-scan-40136541061.json
      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-node-scan-diagnostics
          path: diagnostics/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: public
          retention-days: 1
  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
