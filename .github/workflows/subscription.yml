name: Manual private subscription verification
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of already-measured subscription nodes to verify (1-35)
        type: string
        default: '35'
permissions:
  contents: read
concurrency:
  group: gate-test-manual
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/*.test.mjs
      - name: Verify real exits without saving the private subscription
        run: node node-checker/verify-subscription.mjs
        env:
          TEST_ADMIN: ${{ secrets.TEST_ADMIN }}
          SUB_TEST_LIMIT: ${{ inputs.limit }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-subscription-verification
          path: diagnostics/subscription/run.json
          retention-days: 1
          if-no-files-found: error
