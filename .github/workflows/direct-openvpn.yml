name: Manual remote OpenVPN diagnostics (local acceptance required)
on:
  workflow_dispatch:
    inputs:
      batch:
        description: Initial profiles or remaining entrances from the original candidate pool
        type: choice
        options:
          - initial
          - remaining
        default: initial
permissions:
  contents: read
concurrency:
  group: gate-test-manual
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Verify direct OpenVPN exits before publishing any subscription
        run: python verify_openvpn.py
        env:
          OPENVPN_BATCH: ${{ inputs.batch }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-direct-openvpn-diagnostics
          path: diagnostics/openvpn-verification/run.json
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: public
          retention-days: 1
